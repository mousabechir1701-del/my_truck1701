<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e2427">

<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{color-scheme:dark;--bg:#1e2427;--card:#283035;--line:#3a454a;--tx:#e4e2d8;--mut:#a3aea9;--inc:#8fd0c0;--exp:#d9a0a0;--net:#e3c97f;--btn:#3e6b66;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo','DejaVu Sans',Tahoma,sans-serif;font-size:16px;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:16px 16px 32px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:20px;margin:4px 0}
.ver-badge{font-size:11px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-inline-start:6px;vertical-align:middle}
.lang{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}
.trucks{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.trucks select{flex:1;min-width:120px}
.trucks input{flex:1;min-width:100px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero .big{font-size:38px;font-weight:700;color:var(--net);line-height:1.2}
.hero small{color:var(--mut)}
.bar{height:10px;background:var(--bg);border-radius:6px;margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--inc);width:0;transition:width .25s ease}
.goal{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px;color:var(--mut)}
.goal input{width:110px}
.tabs{display:flex;gap:6px;margin:16px 0 8px}
.tabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mut);font:inherit;cursor:pointer}
.tabs button.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--card);border-radius:10px;padding:10px;text-align:center;border:1px solid var(--line)}
.sum b{display:block;font-size:18px}.sum span{font-size:13px;color:var(--mut)}
.stat{display:block;margin-top:6px;font-size:13px;color:var(--mut);min-height:1.6em}
.inc{color:var(--inc)}.exp{color:var(--exp)}.net{color:var(--net)}

/* الملخص المالي الذكي */
.smart-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;display:grid;gap:6px}
.smart-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:6px}
.smart-row{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.smart-res{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;margin-top:2px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--bg)}
.smart-res.profit{border-color:var(--inc);color:var(--inc)}
.smart-res.loss{border-color:var(--exp);color:var(--exp)}
.smart-res.even{border-color:var(--net);color:var(--net)}

h2{font-size:16px;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
label{font-size:13px;color:var(--mut);display:grid;gap:2px}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;width:100%}
input[type=date]{direction:ltr}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.go{background:var(--btn);color:#fff;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:600;cursor:pointer;width:auto}
:focus-visible{outline:2px solid var(--net);outline-offset:2px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
li small{color:var(--mut);display:block}
li button{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:4px 8px}
li .ok{border:1px solid var(--line);border-radius:8px;color:var(--inc)}
.warn{color:var(--net)}.late{color:var(--exp)}
.empty{color:var(--mut);padding:12px 0}

/* فلاتر وجدول آخر العمليات */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.f-btns{display:flex;gap:4px;flex:1 1 220px}
.f-btns button{flex:1;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
.f-btns button.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.f-date{display:flex;gap:4px;align-items:center;flex:1 1 150px}
.f-date input[type=date]{padding:5px 8px;font-size:13px}
.f-clr{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 8px;font:inherit;font-size:12px;cursor:pointer}
.f-clr[hidden]{display:none}
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ops-tbl{width:100%;border-collapse:collapse;font-size:13px;text-align:start}
.ops-tbl th,.ops-tbl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.ops-tbl th{color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap;background:rgba(0,0,0,.12)}
.ops-tbl tr:last-child td{border-bottom:none}
.ops-tbl td.c-date{white-space:nowrap;font-size:12px;color:var(--mut);direction:ltr;text-align:start}
.ops-tbl td.c-desc b{display:block;font-size:13px;font-weight:600;color:var(--tx)}
.ops-tbl td.c-desc small{display:block;font-size:11px;color:var(--mut);line-height:1.35}
.ops-tbl td.c-type{white-space:nowrap}
.badge{display:inline-block;padding:2px 6px;border-radius:6px;font-size:11px;font-weight:600}
.badge.b-inc{background:rgba(143,208,192,.14);color:var(--inc);border:1px solid rgba(143,208,192,.35)}
.badge.b-exp{background:rgba(217,160,160,.14);color:var(--exp);border:1px solid rgba(217,160,160,.35)}
.ops-tbl td.c-amt{white-space:nowrap;font-weight:700;font-size:13px}
.ops-tbl td.c-act{text-align:center;width:34px}
.del-op{background:none;border:1px solid transparent;color:var(--mut);border-radius:6px;padding:2px 7px;font-size:16px;line-height:1.2;cursor:pointer}
.del-op:hover,.del-op:focus-visible{color:var(--exp);border-color:var(--line)}
.tbl-empty{padding:16px;text-align:center;color:var(--mut);font-size:14px}

/* زر وقائمة الإعدادات السفلية */
.settings-wrap{position:relative;margin-top:18px;display:flex;flex-direction:column;align-items:flex-start}
.set-btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.set-btn:hover{border-color:var(--net)}
.set-menu{margin-top:8px;width:100%;max-width:270px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:15}
.set-menu[hidden]{display:none}
.set-menu button{width:100%;text-align:start;background:none;border:0;color:var(--tx);padding:9px 10px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.set-menu button:hover,.set-menu button:focus-visible{background:var(--bg)}
.set-menu button.danger{color:var(--exp);border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:2px;padding-top:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);color:var(--tx);padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}.toast.ok{color:var(--inc)}.toast.bad{color:var(--exp)}
.tools{display:flex;gap:6px}
.errbar{background:var(--card);border:1px solid var(--exp);color:var(--exp);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:600}
.errbar[hidden]{display:none}
:root[data-theme="light"]{color-scheme:light;--bg:#eef1f0;--card:#ffffff;--line:#cdd7d4;--tx:#1f2b2d;--mut:#5b6b68;--inc:#1d7a66;--exp:#b04545;--net:#8a6500;--btn:#3e6b66}
:root[data-theme="light"] .ops-tbl th{background:rgba(0,0,0,.04)}
</style>
</head>
<body>
<main>
<div class="top">
  <h1><span data-i="title"></span><span class="ver-badge">v1.0</span></h1>
  <div class="tools"><button class="lang" id="theme" type="button"></button><button class="lang" id="lang" type="button"></button></div>
</div>
<div id="saveErr" class="errbar" role="alert" hidden></div>

<div class="trucks">
  <select id="truck" aria-label="truck"></select>
  <input id="newTruck" type="text" maxlength="30">
  <button class="go" id="addTruck" type="button" data-i="add"></button>
</div>
<div class="trucks">
  <button class="lang" id="renTruck" type="button" data-i="ren"></button>
  <button class="lang" id="delTruck" type="button" data-i="delT"></button>
  <label for="currency" data-i="curl" style="align-self:center"></label>
  <select id="currency"></select>
</div>

<section class="hero">
  <small data-i="seasonNet"></small>
  <div class="big" id="seasonNet"></div>
  <div class="bar"><i id="prog"></i></div>
  <small id="progTxt"></small>
  <div class="goal"><label for="goal" data-i="goal"></label><input id="goal" step="any" type="number" inputmode="numeric" min="0"></div>
</section>

<div class="tabs" id="tabs">
  <button type="button" data-p="day" class="on" data-i="day"></button>
  <button type="button" data-p="month" data-i="month"></button>
  <button type="button" data-p="season" data-i="season"></button>
</div>
<div class="sum">
  <div><b class="inc" id="sInc">0</b><span data-i="inc"></span></div>
  <div><b class="exp" id="sExp">0</b><span data-i="exp"></span></div>
  <div><b class="net" id="sNet">0</b><span data-i="netl"></span></div>
</div>
<small class="stat" id="stat"></small>

<section class="smart-box" aria-label="smart-summary">
  <div class="smart-head">
    <span data-i="smartTitle"></span>
    <span id="smartPeriod"></span>
  </div>
  <div class="smart-row">
    <span data-i="totInc"></span>
    <b class="inc" id="smInc">0</b>
  </div>
  <div class="smart-row">
    <span data-i="totExp"></span>
    <b class="exp" id="smExp">0</b>
  </div>
  <div class="smart-res even" id="smResBox">
    <span id="smResLbl"></span>
    <span id="smResVal">0</span>
  </div>
</section>

<h2 data-i="addTrips"></h2>
<form id="fTrip" novalidate>
  <div class="row">
    <label><span data-i="date"></span><input type="date" id="tDate" required></label>
    <label><span data-i="count"></span><input type="number" id="tCount" min="1" required></label>
  </div>
  <div class="row">
    <label><span data-i="from"></span><input type="text" id="tFrom" maxlength="30" list="places" autocomplete="off"></label>
    <label><span data-i="to"></span><input type="text" id="tTo" maxlength="30" list="places" autocomplete="off"></label>
  </div>
  <label><span data-i="price"></span><input type="number" step="any" id="tPrice" min="0" required></label>
  <label><span data-i="note"></span><input type="text" id="tNote" maxlength="60"></label>
  <button class="go" type="submit" data-i="save"></button>
</form>

<h2 data-i="addExp"></h2>
<form id="fExp" novalidate>
  <div class="row">
    <label><span data-i="date"></span><input type="date" id="eDate" required></label>
    <label><span data-i="type"></span><select id="eType"></select></label>
  </div>
  <label><span data-i="amount"></span><input type="number" step="any" id="eAmt" min="0" required></label>
  <label><span data-i="note"></span><input type="text" id="eNote" maxlength="60"></label>
  <button class="go" type="submit" data-i="save"></button>
</form>

<h2 data-i="maint"></h2>
<ul id="mList"></ul>
<form id="fMaint" novalidate>
  <div class="row">
    <label><span data-i="mName"></span><input type="text" id="mName" maxlength="30" required></label>
    <label><span data-i="every"></span><input type="number" id="mDays" value="30" min="1" required></label>
  </div>
  <label><span data-i="last"></span><input type="date" id="mLast" required></label>
  <button class="go" type="submit" data-i="addMaint"></button>
</form>

<h2 data-i="recent"></h2>
<div class="filters">
  <div class="f-btns" id="opFilters">
    <button type="button" data-f="all" class="on" data-i="fAll"></button>
    <button type="button" data-f="trip" data-i="fTrips"></button>
    <button type="button" data-f="exp" data-i="fExps"></button>
  </div>
  <div class="f-date">
    <input type="date" id="fDate" aria-label="filter-date">
    <button type="button" class="f-clr" id="fDateClr" hidden>×</button>
  </div>
</div>
<div class="tbl-wrap">
  <table class="ops-tbl">
    <thead>
      <tr>
        <th data-i="colDate"></th>
        <th data-i="colDesc"></th>
        <th data-i="colType"></th>
        <th data-i="colAmt"></th>
        <th data-i="colAct"></th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
</div>

<div class="settings-wrap" id="settingsWrap">
  <button type="button" class="set-btn" id="settingsBtn" aria-expanded="false" aria-controls="settingsMenu">
    <span>⚙️</span><span data-i="settings"></span>
  </button>
  <div class="set-menu" id="settingsMenu" hidden>
    <button type="button" id="copy"></button>
    <button type="button" id="share" data-i="share"></button>
    <button type="button" id="backup" data-i="backup"></button>
    <button type="button" id="restore" data-i="restore"></button>
    <button type="button" id="reset" class="danger" data-i="reset"></button>
  </div>
</div>
<input type="file" id="impFile" accept="application/json,.json" hidden>
</main>
<datalist id="places"></datalist>
<div id="msg" class="toast" role="status" aria-live="polite"></div>

      if(t.name!==undefined&&typeof t.name!=='string')return null;
      if(t.currency!==undefined&&(typeof t.currency!=='string'||!isKnownCur(t.currency)))return null;
      var nt={id:t.id,name:cleanStr(t.name,30)};
      if(t.currency!==undefined)nt.currency=t.currency;
      if(t.goal!==undefined&&t.goal!==null){if(!isNum(t.goal)||t.goal<0||t.goal>1e12)return null;nt.goal=t.goal;}

        ne.count=e.count;ne.price=e.price;
      }else if(e.kind==='exp'){
        var ty=TYPES.indexOf(e.type)>=0?e.type:OLDMAP[e.type];
        if(!ty||!isNum(e.amount)||e.amount<0||e.amount>1e12)return null;
        ne.type=ty;ne.amount=e.amount;
      }else return null;

      if(ne.bad)return null;
      ne.note=cleanStr(e.note,60);
      if(e.kind==='trip'){ne.from=cleanStr(e.from,30);ne.to=cleanStr(e.to,30);}
      O.entries.push(ne);if(e.id>maxId)maxId=e.id;
    }
    var mseen={};

    for(i=0;i<d.entries.length;i++){
      if(seen[O.entries[i].id])O.entries[i].id=++maxId;
      seen[O.entries[i].id]=1;
    }
    var md=d.maint||[];
    for(i=0;i<md.length;i++){
      m=md[i];
      if(!m||typeof m!=='object'||!isNum(m.id)||!tids[m.truck])return null;
      var nm=cleanStr(m.name,30);
      if(!nm||!isNum(m.days)||m.days<1||m.days>36500||!isDateStr(m.last))return null;

      mseen[m.id]=1;

    }

}

      var tdDate=mk('td',e.date,'c-date');
      var tdDesc=mk('td',null,'c-desc');
      var titleTxt=e.kind==='trip'?(e.count+T('trip')+fmtN(e.price)+T('cur')):T('t_'+e.type);
      tdDesc.appendChild(mk('b',titleTxt));
      var subParts=[];
      var rt=routeTxt(e);if(rt)subParts.push(rt);
      if(e.note)subParts.push(e.note);
      if(subParts.length)tdDesc.appendChild(mk('small',subParts.join(' · ')));

      var tdType=mk('td',null,'c-type');
      tdType.appendChild(mk('span',e.kind==='trip'?T('typeTrip'):T('typeExp'),'badge '+(e.kind==='trip'?'b-inc':'b-exp')));

      var amtStr=iso((e.kind==='trip'?'+':'-')+fmtM(mv(e))+T('cur'));
      var tdAmt=mk('td',amtStr,'c-amt '+(e.kind==='trip'?'inc':'exp'));

      var tdAct=mk('td',null,'c-act');
      var x=mk('button','×','del-op');x.type='button';x.setAttribute('aria-label',T('del'));x.title=T('del');
      x.onclick=function(){
        if(!confirm(T('delc')))return;
        S.entries=S.entries.filter(function(y){return y.id!==e.id;});
        save();render();
      };
      tdAct.appendChild(x);

      tr.appendChild(tdDate);
      tr.appendChild(tdDesc);
      tr.appendChild(tdType);
      tr.appendChild(tdAmt);
      tr.appendChild(tdAct);
      tbody.appendChild(tr);
    });
  }
}

setDates();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&today()!==lastToday){setDates();render();}});
window.addEventListener('storage',function(ev){
  if(ev.key!==KEY||!ev.newValue)return;
  try{var d=JSON.parse(ev.newValue);if(d&&Array.isArray(d.trucks)){S=d;normalize();render();}}catch(e){}
});
$('lang').onclick=function(){S.lang=S.lang==='ar'?'fr':'ar';$('mName').value='';save();render();};
$('theme').onclick=function(){S.theme=S.theme==='light'?'dark':'light';save();render();};
$('truck').onchange=function(){S.cur=Number(this.value);priceAutoSet=false;$('tPrice').value='';save();render();};
$('addTruck').onclick=function(){var n=$('newTruck').value.trim().slice(0,30);if(!n)return;var id=uid();S.trucks.push({id:id,name:n,goal:0,currency:curCode()});S.cur=id;$('newTruck').value='';save();render();};
$('renTruck').onclick=function(){var t=curTruck();var n=prompt(T('renP'),t.name||'');if(n===null)return;t.name=n.trim().slice(0,30);save();render();};
$('delTruck').onclick=function(){
  if(S.trucks.length<=1){toast('last');return;}
  if(!confirm(T('delTc')))return;
  var id=S.cur;
  S.trucks=S.trucks.filter(function(t){return t.id!==id;});
  S.entries=S.entries.filter(function(e){return e.truck!==id;});
  S.maint=S.maint.filter(function(m){return m.truck!==id;});
  S.cur=S.trucks[0].id;save();render();
};

$('tFrom').addEventListener('input',autoPrice);
$('tTo').addEventListener('input',autoPrice);
$('tPrice').addEventListener('input',function(){priceAutoSet=false;});

$('fTrip').onsubmit=function(ev){
  ev.preventDefault();
  var c=Number($('tCount').value),p=Number($('tPrice').value);
  if(!isDateStr($('tDate').value)||!(Number.isInteger(c)&&c>=1&&c<=100000)||$('tPrice').value===''||!(isFinite(p)&&p>=0&&p<=1e12)){toast('bad');return;}
  S.entries.push({id:uid(),truck:S.cur,kind:'trip',date:$('tDate').value,count:c,price:p,from:$('tFrom').value.trim().slice(0,30),to:$('tTo').value.trim().slice(0,30),note:$('tNote').value.trim().slice(0,60)});
  /* تصفير جميع خانات الرحلة بعد الحفظ */
  $('tCount').value='';
  $('tFrom').value='';
  $('tTo').value='';
  $('tPrice').value='';
  $('tNote').value='';
  priceAutoSet=false;
  var ok=save();render();if(ok)toast('ok');
};

$('fExp').onsubmit=function(ev){
  ev.preventDefault();
  var a=Number($('eAmt').value);
  if(!isDateStr($('eDate').value)||$('eAmt').value===''||!(isFinite(a)&&a>=0&&a<=1e12)||TYPES.indexOf($('eType').value)<0){toast('bad');return;}
  S.entries.push({id:uid(),truck:S.cur,kind:'exp',date:$('eDate').value,type:$('eType').value,amount:a,note:$('eNote').value.trim().slice(0,60)});
  /* تصفير خانة المبلغ والملاحظة مع الإبقاء على نوع المصروف المختار */
  $('eAmt').value='';
  $('eNote').value='';
  $('eType').selectedIndex=0;
  var ok=save();render();if(ok)toast('ok');
};

$('fMaint').onsubmit=function(ev){
  ev.preventDefault();
  var n=$('mName').value.trim().slice(0,30),d=Number($('mDays').value);
  if(!n||!(Number.isInteger(d)&&d>=1&&d<=36500)||!isDateStr($('mLast').value)){toast('bad');return;}
  S.maint.push({id:uid(),truck:S.cur,name:n,days:d,last:$('mLast').value});
  $('mName').value='';$('mDays').value=30;var ok=save();render();if(ok)toast('ok');
};

$('currency').onchange=function(){var c=this.value;if(!has(CURS,c))return;S.trucks.forEach(function(t){if(t.id===S.cur)t.currency=c;});save();render();};
$('goal').onchange=function(){var t=curTruck();if(!t)return;var g=Number($('goal').value);t.goal=(isFinite(g)&&g>0)?Math.min(g,1e12):0;save();render();};
$('tabs').onclick=function(ev){var b=ev.target.closest('button');if(!b)return;period=b.dataset.p;Array.prototype.forEach.call(this.children,function(c){c.classList.toggle('on',c===b);});render();};

/* فلاتر جدول آخر العمليات */
$('opFilters').onclick=function(ev){
  var b=ev.target.closest('button');if(!b)return;
  opFilter=b.dataset.f||'all';
  Array.prototype.forEach.call(this.children,function(c){c.classList.toggle('on',c===b);});
  render();
};
$('fDate').onchange=function(){
  opDate=this.value||'';
  $('fDateClr').hidden=!opDate;
  render();
};
$('fDateClr').onclick=function(){
  opDate='';$('fDate').value='';this.hidden=true;render();
};

/* فتح وإغلاق قائمة الإعدادات */
function closeSettings(){
  $('settingsMenu').hidden=true;
  $('settingsBtn').setAttribute('aria-expanded','false');
}
$('settingsBtn').onclick=function(ev){
  ev.stopPropagation();
  var menu=$('settingsMenu');
  var willOpen=menu.hidden;
  menu.hidden=!willOpen;
  this.setAttribute('aria-expanded',willOpen?'true':'false');
};
document.addEventListener('click',function(ev){
  var wrap=$('settingsWrap');
  if(wrap&&!wrap.contains(ev.target))closeSettings();
});

$('reset').onclick=function(){
  closeSettings();
  if(!confirm(T('confirm')))return;
  if(!confirm(T('confirm2')))return;
  try{localStorage.setItem(KEY+'-manual-reset-backup',JSON.stringify(S));}catch(e){}
  var keepLang=S.lang,keepTheme=S.theme,keepCur=has(CURS,curCode())?curCode():'LYD';
  var freshId=uid();
  S={lang:keepLang,theme:keepTheme,trucks:[{id:freshId,name:'',goal:0,currency:keepCur}],cur:freshId,entries:[],maint:[]};
  normalize();
  if(save()){render();toast('reset');}
};
$('copy').onclick=function(){
  function done(){$('copy').textContent='✓ '+T('copied');setTimeout(function(){$('copy').textContent='📋 '+T('copy');closeSettings();},1200);}
  function fallback(){
    try{
      var ta=document.createElement('textarea');
      ta.value=summary();ta.setAttribute('readonly','');
      ta.style.position='fixed';ta.style.opacity='0';ta.style.top='0';
      document.body.appendChild(ta);ta.select();
      var ok=document.execCommand('copy');
      document.body.removeChild(ta);
      if(ok)done();
    }catch(e){}
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(summary()).then(done).catch(fallback);
      return;
    }
  }catch(e){}
  fallback();
};
$('share').onclick=function(){closeSettings();window.open('https://wa.me/?text='+encodeURIComponent(summary()),'_blank');};
$('backup').onclick=function(){
  closeSettings();
  try{
    var blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='truck-backup-'+today()+'.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  }catch(e){}
};
$('restore').onclick=function(){closeSettings();$('impFile').click();};
$('impFile').onchange=function(){
  var f=this.files&&this.files[0];this.value='';if(!f)return;
  if(f.size>MAXFILE){toast('impbad');return;}
  var r=new FileReader();
  r.onload=function(){
    var O=null;
    try{O=validateBackup(JSON.parse(r.result));}catch(e){O=null;}
    if(!O){toast('impbad');return;}
    if(!confirm(T('rfile')+O.trucks.length+T('rc1')+O.entries.length+T('rc2')+'\n\n'+T('restoreC')))return;
    var prevS=S;
    try{localStorage.setItem(KEY+'-prev',JSON.stringify(S));}catch(e){}
    S=O;normalize();
    if(!save()){S=prevS;normalize();render();return;}
    setDates();$('mName').value='';priceAutoSet=false;$('tPrice').value='';render();toast('imp');
  };
  r.onerror=function(){toast('impbad');};
  r.readAsText(f);
};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
load();save();render();
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    var had=!!navigator.serviceWorker.controller,reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",function(){if(had&&!reloaded){reloaded=true;location.reload();}});
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
