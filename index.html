<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر الشاحنة</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e2427">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#1e2427;--card:#283035;--line:#3a454a;--tx:#e4e2d8;--mut:#a3aea9;--inc:#8fd0c0;--exp:#d9a0a0;--net:#e3c97f;--btn:#3e6b66;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo','DejaVu Sans',Tahoma,sans-serif;font-size:16px;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:20px;margin:4px 0}
.lang{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}
.trucks{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.trucks select{flex:1;min-width:120px}
.trucks input{flex:1;min-width:100px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero .big{font-size:38px;font-weight:700;color:var(--net);line-height:1.2}
.hero small{color:var(--mut)}
.bar{height:10px;background:var(--bg);border-radius:6px;margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--inc);width:0}
.goal{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px;color:var(--mut)}
.goal input{width:110px}
.tabs{display:flex;gap:6px;margin:16px 0 8px}
.tabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mut);font:inherit;cursor:pointer}
.tabs button.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--card);border-radius:10px;padding:10px;text-align:center;border:1px solid var(--line)}
.sum b{display:block;font-size:18px}.sum span{font-size:13px;color:var(--mut)}
.inc{color:var(--inc)}.exp{color:var(--exp)}.net{color:var(--net)}
h2{font-size:16px;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
label{font-size:13px;color:var(--mut);display:grid;gap:2px}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.go{background:var(--btn);color:#fff;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:600;cursor:pointer;width:auto}
:focus-visible{outline:2px solid var(--net);outline-offset:2px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
li small{color:var(--mut);display:block}
li button{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:4px 8px}
li .ok{border:1px solid var(--line);border-radius:8px;color:var(--inc)}
.warn{color:var(--net)}.late{color:var(--exp)}
.empty{color:var(--mut);padding:12px 0}
.foot{display:flex;gap:8px;margin-top:12px}
.foot button{flex:1;background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:8px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<main>
<div class="top"><h1 data-i="title"></h1><button class="lang" id="lang"></button></div>

<div class="trucks">
  <select id="truck" aria-label="truck"></select>
  <input id="newTruck" type="text" maxlength="30">
  <button class="go" id="addTruck" data-i="add"></button>
</div>

<section class="hero">
  <small data-i="seasonNet"></small>
  <div class="big" id="seasonNet"></div>
  <div class="bar"><i id="prog"></i></div>
  <small id="progTxt"></small>
  <div class="goal"><label for="goal" data-i="goal"></label><input id="goal" type="number" inputmode="numeric" min="0"></div>
</section>

<div class="tabs" id="tabs">
  <button data-p="day" class="on" data-i="day"></button><button data-p="month" data-i="month"></button><button data-p="season" data-i="season"></button>
</div>
<div class="sum">
  <div><b class="inc" id="sInc">0</b><span data-i="inc"></span></div>
  <div><b class="exp" id="sExp">0</b><span data-i="exp"></span></div>
  <div><b class="net" id="sNet">0</b><span data-i="netl"></span></div>
</div>

<h2 data-i="addTrips"></h2>
<form id="fTrip">
  <div class="row">
    <label><span data-i="date"></span><input type="date" id="tDate" required></label>
    <label><span data-i="count"></span><input type="number" id="tCount" value="1" min="1" required></label>
  </div>
  <label><span data-i="price"></span><input type="number" id="tPrice" value="800" min="0" required></label>
  <button class="go" type="submit" data-i="save"></button>
</form>

<h2 data-i="addExp"></h2>
<form id="fExp">
  <div class="row">
    <label><span data-i="date"></span><input type="date" id="eDate" required></label>
    <label><span data-i="type"></span><select id="eType"></select></label>
  </div>
  <label><span data-i="amount"></span><input type="number" id="eAmt" value="200" min="0" required></label>
  <button class="go" type="submit" data-i="save"></button>
</form>

<h2 data-i="maint"></h2>
<ul id="mList"></ul>
<form id="fMaint">
  <div class="row">
    <label><span data-i="mName"></span><input type="text" id="mName" maxlength="30" required></label>
    <label><span data-i="every"></span><input type="number" id="mDays" value="30" min="1" required></label>
  </div>
  <label><span data-i="last"></span><input type="date" id="mLast" required></label>
  <button class="go" type="submit" data-i="addMaint"></button>
</form>

<h2 data-i="recent"></h2>
<ul id="list"></ul>

<div class="foot">
  <button id="copy"></button>
  <button id="reset" data-i="reset"></button>
</div>
</main>

<script>
(function(){
var KEY='truck-tracker-v2',OLD='truck-tracker-v1',period='day';
var D={
ar:{title:'دفتر الشاحنة',seasonNet:'صافي الموسم حتى اليوم',goal:'هدفك للعودة (د.ل)',noGoal:'اكتب هدفك لتشوف النسبة',goalTxt:'% من الهدف، باقي ',day:'اليوم',month:'الشهر',season:'الموسم',inc:'الدخل',exp:'المصاريف',netl:'الصافي',addTrips:'سجّل رحلات',date:'التاريخ',count:'عدد الرحلات',price:'أجرة الرحلة (د.ل)',save:'حفظ',addExp:'سجّل مصروف',type:'النوع',amount:'المبلغ (د.ل)',maint:'تذكير الصيانة',mName:'الاسم',every:'كل كم يوم',last:'آخر مرة',addMaint:'إضافة تذكير',done:'تم اليوم',inn:'باقي ',late:'متأخر ',days:' يوم',recent:'آخر العمليات',none:'ما فيه عمليات بعد. سجّل أول رحلة.',noM:'ما فيه تذكيرات. أضف تغيير الزيت مثلاً.',copy:'نسخ الملخص',copied:'تم النسخ',reset:'مسح بيانات هذه الشاحنة',confirm:'تمسح بيانات هذه الشاحنة؟',add:'إضافة شاحنة',nt:'اسم شاحنة جديدة',trip:' رحلة × ',del:'حذف',t_fuel:'بنزين',t_food:'أكل وشرب',t_oil:'زيت',t_tires:'عجلات',t_repair:'عطل وإصلاح',t_other:'أخرى',def:'شاحنتي',oil:'تغيير الزيت',sum:'دخل: ',sum2:' | مصاريف: ',sum3:' | صافي: ',cur:' د.ل'},
fr:{title:'Carnet du camion',seasonNet:'Net de la saison à ce jour',goal:'Objectif pour rentrer (LYD)',noGoal:'Entrez votre objectif',goalTxt:'% de l’objectif, reste ',day:'Jour',month:'Mois',season:'Saison',inc:'Revenus',exp:'Dépenses',netl:'Net',addTrips:'Ajouter des trajets',date:'Date',count:'Nombre de trajets',price:'Prix du trajet (LYD)',save:'Enregistrer',addExp:'Ajouter une dépense',type:'Type',amount:'Montant (LYD)',maint:'Rappels d’entretien',mName:'Nom',every:'Tous les (jours)',last:'Dernière fois',addMaint:'Ajouter un rappel',done:'Fait aujourd’hui',inn:'Dans ',late:'En retard de ',days:' j',recent:'Dernières opérations',none:'Aucune opération. Ajoutez un premier trajet.',noM:'Aucun rappel. Ajoutez la vidange par exemple.',copy:'Copier le résumé',copied:'Copié',reset:'Effacer les données de ce camion',confirm:'Effacer les données de ce camion ?',add:'Ajouter un camion',nt:'Nom du nouveau camion',trip:' trajets × ',del:'Supprimer',t_fuel:'Carburant',t_food:'Repas',t_oil:'Huile',t_tires:'Pneus',t_repair:'Panne et réparation',t_other:'Autre',def:'Mon camion',oil:'Vidange',sum:'Revenus : ',sum2:' | Dépenses : ',sum3:' | Net : ',cur:' LYD'}
};
var TYPES=['fuel','food','oil','tires','repair','other'],OLDMAP={'بنزين':'fuel','أكل وشرب':'food','زيت':'oil','عجلات':'tires','عطل وإصلاح':'repair','أخرى':'other'};
var S={lang:'ar',goal:0,trucks:[],cur:null,entries:[],maint:[]};
function $(i){return document.getElementById(i);}
function T(k){return D[S.lang][k]||k;}
function fmt(n){return Math.round(n).toLocaleString('en-US');}
function pad(n){return String(n).padStart(2,'0');}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function uid(){return Date.now()+Math.floor(Math.random()*1000);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.trucks){S=d;return;}}}catch(e){}
  var id=uid();S.trucks=[{id:id,name:''}];S.cur=id;
  try{var o=JSON.parse(localStorage.getItem(OLD)||'null');
    if(o&&o.entries){S.goal=o.goal||0;S.entries=o.entries.map(function(e){e.truck=id;if(e.kind==='exp')e.type=OLDMAP[e.type]||'other';return e;});}}catch(e){}
}
function val(e){return e.kind==='trip'?e.count*e.price:e.amount;}
function mine(){return S.entries.filter(function(e){return e.truck===S.cur;});}
function inPeriod(e){var t=today();return period==='season'||(period==='day'?e.date===t:e.date.slice(0,7)===t.slice(0,7));}
function dayNum(s){return Math.round(new Date(s+'T00:00:00').getTime()/86400000);}
function tname(t){return t.name||T('def');}
function mk(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e;}

function render(){
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  Array.prototype.forEach.call(document.querySelectorAll('[data-i]'),function(e){e.textContent=T(e.dataset.i);});
  $('lang').textContent=S.lang==='ar'?'Français':'العربية';
  $('newTruck').placeholder=T('nt');$('copy').textContent=T('copy');
  document.title=T('title');
  var sel=$('truck');sel.innerHTML='';
  S.trucks.forEach(function(t){var o=mk('option',tname(t));o.value=t.id;if(t.id===S.cur)o.selected=true;sel.appendChild(o);});
  var et=$('eType'),cv=et.value;et.innerHTML='';
  TYPES.forEach(function(k){var o=mk('option',T('t_'+k));o.value=k;et.appendChild(o);});if(cv)et.value=cv;
  if(!$('mName').value)$('mName').value=T('oil');

  var inc=0,exp=0,sI=0,sE=0,es=mine();
  es.forEach(function(e){var v=val(e);if(e.kind==='trip')sI+=v;else sE+=v;if(inPeriod(e)){if(e.kind==='trip')inc+=v;else exp+=v;}});
  $('sInc').textContent=fmt(inc);$('sExp').textContent=fmt(exp);$('sNet').textContent=fmt(inc-exp);
  var net=sI-sE;$('seasonNet').textContent=fmt(net)+T('cur');
  var g=Number(S.goal)||0;$('goal').value=g||'';
  if(g>0){var p=Math.max(0,Math.min(100,net/g*100));$('prog').style.width=p+'%';$('progTxt').textContent=fmt(p)+T('goalTxt')+fmt(Math.max(0,g-net))+T('cur');}
  else{$('prog').style.width='0';$('progTxt').textContent=T('noGoal');}

  var ml=$('mList');ml.innerHTML='';
  var ms=S.maint.filter(function(m){return m.truck===S.cur;});
  if(!ms.length)ml.appendChild(mk('li',T('noM'),'empty'));
  ms.forEach(function(m){
    var left=dayNum(m.last)+Number(m.days)-dayNum(today());
    var li=mk('li'),d=mk('div'),b=mk('b',m.name),s=mk('small',left>=0?T('inn')+left+T('days'):T('late')+(-left)+T('days'),left<0?'late':(left<=5?'warn':''));
    d.appendChild(b);d.appendChild(s);
    var ok=mk('button',T('done'),'ok');ok.onclick=function(){m.last=today();save();render();};
    var x=mk('button','×');x.setAttribute('aria-label',T('del'));x.onclick=function(){S.maint=S.maint.filter(function(y){return y.id!==m.id;});save();render();};
    li.appendChild(d);li.appendChild(ok);li.appendChild(x);ml.appendChild(li);
  });

  var ul=$('list');ul.innerHTML='';
  var sorted=es.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id;}).slice(0,30);
  if(!sorted.length)ul.appendChild(mk('li',T('none'),'empty'));
  sorted.forEach(function(e){
    var li=mk('li'),d=mk('div'),b=mk('b',e.kind==='trip'?e.count+T('trip')+fmt(e.price):T('t_'+e.type)),sm=mk('small',e.date);
    d.appendChild(b);d.appendChild(sm);
    var a=mk('span',(e.kind==='trip'?'+':'-')+fmt(val(e)),e.kind==='trip'?'inc':'exp');
    var x=mk('button','×');x.setAttribute('aria-label',T('del'));
    x.onclick=function(){S.entries=S.entries.filter(function(y){return y.id!==e.id;});save();render();};
    li.appendChild(d);li.appendChild(a);li.appendChild(x);ul.appendChild(li);
  });
}

$('tDate').value=$('eDate').value=$('mLast').value=today();
$('lang').onclick=function(){S.lang=S.lang==='ar'?'fr':'ar';$('mName').value='';save();render();};
$('truck').onchange=function(){S.cur=Number(this.value);save();render();};
$('addTruck').onclick=function(){var n=$('newTruck').value.trim();if(!n)return;var id=uid();S.trucks.push({id:id,name:n});S.cur=id;$('newTruck').value='';save();render();};
$('fTrip').onsubmit=function(ev){ev.preventDefault();S.entries.push({id:uid(),truck:S.cur,kind:'trip',date:$('tDate').value,count:Number($('tCount').value),price:Number($('tPrice').value)});$('tCount').value=1;save();render();};
$('fExp').onsubmit=function(ev){ev.preventDefault();S.entries.push({id:uid(),truck:S.cur,kind:'exp',date:$('eDate').value,type:$('eType').value,amount:Number($('eAmt').value)});save();render();};
$('fMaint').onsubmit=function(ev){ev.preventDefault();S.maint.push({id:uid(),truck:S.cur,name:$('mName').value.trim(),days:Number($('mDays').value),last:$('mLast').value});$('mName').value='';save();render();};
$('goal').onchange=function(){S.goal=Number($('goal').value)||0;save();render();};
$('tabs').onclick=function(ev){var b=ev.target.closest('button');if(!b)return;period=b.dataset.p;Array.prototype.forEach.call(this.children,function(c){c.classList.toggle('on',c===b);});render();};
$('reset').onclick=function(){if(confirm(T('confirm'))){S.entries=S.entries.filter(function(e){return e.truck!==S.cur;});S.maint=S.maint.filter(function(m){return m.truck!==S.cur;});save();render();}};
$('copy').onclick=function(){var t=T('sum')+$('sInc').textContent+T('sum2')+$('sExp').textContent+T('sum3')+$('sNet').textContent+T('cur');
  try{navigator.clipboard.writeText(t);$('copy').textContent=T('copied');setTimeout(function(){$('copy').textContent=T('copy');},1500);}catch(e){}};
load();render();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
</html>
